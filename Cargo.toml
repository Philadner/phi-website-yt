[package]
name = "phi-website-yt"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "0.28", features = ["tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "0.12", features = ["json"] }
rusty_ytdl = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
url = "2"
vercel_runtime = { version = "2" }

[[bin]]
name = "ytdl"
path = "api/ytdl.rs"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
